name: pqkeystore_example
description: "Demonstrates how to use the pqkeystore package."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Must match the package constraints in ../pubspec.yaml (TRK-001).
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  pqkeystore:
    path: ../

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # Hosts the five-platform contract suite (integration_test/).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
